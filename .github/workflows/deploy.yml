name: Deploy to Cloudflare Pages

# Deploie le site sur Cloudflare Pages a chaque push sur main.
# L'integration Git native de CF Pages ne declenchait plus rien depuis le 11/05 ;
# ce workflow refait le deploiement explicitement via wrangler.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=horlogerie-francaise --branch=main
